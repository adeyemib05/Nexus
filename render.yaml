services:
  - type: web
    name: nexus-backend
    runtime: node
    rootDir: backend
    buildCommand: npm install && npm run build
    startCommand: npm run start
    plan: free
    region: oregon
    envVars:
      - key: PORT
        value: 3001
      - key: BITGET_API_KEY
        sync: false
      - key: BITGET_SECRET_KEY
        sync: false
      - key: BITGET_PASSPHRASE
        sync: false
      - key: QWEN_API_KEY
        sync: false
      - key: QWEN_BASE_URL
        value: https://hackathon.bitgetops.com/v1
      - key: QWEN_MODEL
        value: qwen3.8-max
      - key: GROQ_API_KEY
        sync: false
      - key: ALLOWED_ORIGINS
        value: https://nexus-orcin-eight.vercel.app,http://localhost:5173
